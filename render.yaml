services:
  - type: web
    name: privacylens-backend
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: NVIDIA_API_KEY
        sync: false
      - key: EMBEDDING_PROVIDER
        value: nvidia
      - key: EMBEDDING_MODEL
        value: nvidia/nemotron-3-embed-1b
      - key: EMBEDDING_BATCH_SIZE
        value: "32"
      - key: EMBEDDING_CONCURRENCY
        value: "4"
      - key: NVIDIA_CHAT_MODEL
        value: meta/llama-3.1-70b-instruct
      - key: NVIDIA_BASE_URL
        value: https://integrate.api.nvidia.com/v1
    healthCheckPath: /health
